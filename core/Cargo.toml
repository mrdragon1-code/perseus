[package]
name = "perseus-core"
version = "0.1.0"
edition = "2021"

[lib]
name = "perseus_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
argon2 = "0.5"
chacha20poly1305 = { version = "0.10", features = ["stream"] }
hkdf = "0.12"
sha2 = "0.10"
rand = "0.8"
zeroize = "1"
hex = "0.4"
thiserror = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
nokhwa = { version = "0.10", features = ["input-msmf"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_Security_Cryptography"] }

[build-dependencies]
csbindgen = "1"

[dev-dependencies]
tempfile = "3"
